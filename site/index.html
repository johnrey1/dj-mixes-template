<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Static fallback for link-preview scrapers (iMessage/Slack/Discord) that don't
     run JS. Keep this in sync by hand with siteName in config.js — app.js also
     sets document.title at runtime for the live tab title, but this tag is what
     shows up in shared-link previews before any JS executes. -->
<title>My DJ Mixes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/wavesurfer.js/7.8.6/wavesurfer.min.js" defer></script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="site-header">
  <div class="eq" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <p class="eyebrow" id="site-eyebrow"></p>
  <h1 id="site-name"></h1>
  <p class="subtitle" id="site-tagline"></p>
</header>

<nav id="mix-filters" class="mix-filters" aria-label="Filter mixes"></nav>

<main id="mix-list" class="mix-list" aria-live="polite">
  <p class="loading">loading transmission&hellip;</p>
</main>

<footer class="site-footer">
  <p id="site-footer-text"></p>
</footer>

<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
